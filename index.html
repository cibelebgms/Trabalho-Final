<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Central News</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { background:#f4f6f8; font-family:Arial,sans-serif; }
  .cabecalho { background:#1f3a5f; }
  .secao { padding-top:40px; }
  .titulo-secao { color:#1f3a5f; border-left:6px solid #e8a317; padding-left:12px; margin-bottom:24px; }
  .carousel-item img { height:420px; object-fit:cover; background:#cfd6dd; }
  .carousel-caption { background:rgba(0,0,0,.55); border-radius:8px; }
  .carousel-caption a { color:#fff; text-decoration:none; }
  .card img { height:200px; object-fit:cover; background:#cfd6dd; }
  .card-title a { color:#1f3a5f; text-decoration:none; }
  .caixa-aluno { background:#fff; border-radius:8px; padding:24px; box-shadow:0 2px 6px rgba(0,0,0,.1); }
  .rodape { background:#1f3a5f; color:#fff; text-align:center; padding:20px; margin-top:40px; }
  @media (max-width:992px){ .carousel-item img{height:340px;} }
  @media (max-width:576px){
    .carousel-item img{height:220px;}
    .carousel-caption{position:static; background:#1f3a5f; border-radius:0;}
  }
</style>
</head>
<body>

<nav class="navbar navbar-expand-md navbar-dark cabecalho">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">Central News</a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="#destaques">Destaques</a></li>
        <li class="nav-item"><a class="nav-link" href="#noticias">Notícias</a></li>
        <li class="nav-item"><a class="nav-link" href="#aluno">Sobre</a></li>
      </ul>
    </div>
  </div>
</nav>

<section id="destaques" class="container secao">
  <h2 class="titulo-secao">Itens em Destaque</h2>
  <div id="carrossel" class="carousel slide" data-bs-ride="carousel">
    <div class="carousel-inner" id="carrossel-itens"></div>
    <button class="carousel-control-prev" data-bs-target="#carrossel" data-bs-slide="prev"><span class="carousel-control-prev-icon"></span></button>
    <button class="carousel-control-next" data-bs-target="#carrossel" data-bs-slide="next"><span class="carousel-control-next-icon"></span></button>
  </div>
</section>

<section id="noticias" class="container secao">
  <h2 class="titulo-secao">Todas as Notícias</h2>
  <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-4" id="lista-cards"></div>
</section>

<section id="aluno" class="container secao">
  <h2 class="titulo-secao">Informações</h2>
  <div id="info-aluno" class="caixa-aluno"></div>
</section>

<footer class="rodape">Central News© 2026</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const dados = { noticias: [
  { id:1, titulo:"A tecnologia que nos ajuda a enxergar mais longe", 
  descricao:"Telescópios e equipamentos modernos ampliam o que a ciência consegue observar.", 
  categoria:"Tecnologia", data:"2026-11-01",
   destaque:true, 
   imagem_principal:"img/tec1.png" },

  { id:2, titulo:"O esporte que move multidões",
   descricao:"Treinos, jogos e torcida mostram a força do esporte na vida das pessoas.",
    categoria:"Esportes",
     data:"2026-11-02",
      destaque:false,
       imagem_principal:"img/esp1.png" },

  { id:3, titulo:"Duran Duran e seus álbuns marcantes",
   descricao:"Conheça a banda britânica e três dos seus álbuns mais conhecidos.",
    categoria:"Música", data:"2026-11-03",
     destaque:true,
      imagem_principal:"img/notorius.png"},

  { id:4, titulo:"Economia no dia a dia",
   descricao:"Entender dinheiro, preços e planejamento ajuda nas decisões de cada pessoa.",
    categoria:"Economia",
     data:"2026-11-04",
      destaque:false,
       imagem_principal:"img/eco1.png" },

  { id:5, titulo:"Viajar: destinos para conhecer",
   descricao:"Paisagens e lugares que inspiram quem gosta de explorar o mundo.",
    categoria:"Viagens",
     data:"2026-11-05",
      destaque:true,
       imagem_principal:"img/viag1.png" },

  {  id: 6,
    titulo: "Educação: os desafios e as oportunidades do ensino no Brasil",
    descricao: "Conhecimento, aprendizagem e os desafios que moldam o futuro da educação brasileira.",
    categoria: "Educação",
    data: "2026-11-05",
    destaque: true,
    imagem_principal: "img/edu1.png"}]
  }

const aluno = {
  nome:"Cibele Batista Gomes",
  curso:"Sistemas de Informação - PUC Minas",
  sobre:"Estudante de Sistemas de Informação, cursando o primeiro período em busca de conhecimento.",
  
  redes:[ {nome:"GitHub", link:"https://github.com/cibelebgms"}, {nome:"LinkedIn", link:"https://github.com/cibelebgms"} ]
};

function formatarData(d){ return new Date(d+"T00:00:00").toLocaleDateString("pt-BR"); }

/*Carrossel*/
let html = "";
dados.noticias.filter(n => n.destaque).forEach((n,i) => {
  html += `<div class="carousel-item ${i===0?"active":""}">
    <a href="detalhe.html?id=${n.id}"><img src="${n.imagem_principal}" class="d-block w-100" alt="${n.titulo}"></a>
    <div class="carousel-caption"><h5><a href="detalhe.html?id=${n.id}">${n.titulo}</a></h5><p>${n.descricao}</p></div>
  </div>`;
});
document.getElementById("carrossel-itens").innerHTML = html;

/*Cards*/
html = "";
dados.noticias.forEach(n => {
  html += `<div class="col"><div class="card h-100">
    <a href="detalhe.html?id=${n.id}"><img src="${n.imagem_principal}" class="card-img-top" alt="${n.titulo}"></a>
    <div class="card-body">
      <span class="badge bg-secondary mb-2">${n.categoria}</span>
      <h5 class="card-title"><a href="detalhe.html?id=${n.id}">${n.titulo}</a></h5>
      <p class="card-text">${n.descricao}</p>
    </div>
    <div class="card-footer"><small class="text-muted">${formatarData(n.data)}</small></div>
  </div></div>`;
});
document.getElementById("lista-cards").innerHTML = html;

/*aluno*/
let redes = "";
aluno.redes.forEach(r => { redes += `<a href="${r.link}" target="_blank" class="btn btn-outline-primary btn-sm me-2">${r.nome}</a>`; });
document.getElementById("info-aluno").innerHTML =
  `<h4>${aluno.nome}</h4><p class="text-muted">${aluno.curso}</p>
   <p><strong>Sobre mim:</strong> ${aluno.sobre}</p><p><strong>Autoria:</strong> ${aluno.autoria}</p><div>${redes}</div>`;
</script>
<script src="assets/app.js"></script>
</body>
</html>

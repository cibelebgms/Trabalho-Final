<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meu Site de Notícias</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Seu CSS -->
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

  <!-- CABEÇALHO: logo + menu -->
  <header>
    <nav class="navbar navbar-expand-md navbar-dark cabecalho">
      <div class="container">
        <a class="navbar-brand logo" href="index.html">Meu Site de Notícias</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="#destaques">Destaques</a></li>
            <li class="nav-item"><a class="nav-link" href="#noticias">Notícias</a></li>
            <li class="nav-item"><a class="nav-link" href="#aluno">Sobre</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main>
    <!-- SEÇÃO 1: carrossel de destaques (montado pelo JS) -->
    <section id="destaques" class="container secao">
      <h2 class="titulo-secao">Itens em Destaque</h2>
      <div id="carrossel" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner" id="carrossel-itens"></div>

        <button class="carousel-control-prev" type="button" data-bs-target="#carrossel" data-bs-slide="prev">
          <span class="carousel-control-prev-icon"></span>
          <span class="visually-hidden">Anterior</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carrossel" data-bs-slide="next">
          <span class="carousel-control-next-icon"></span>
          <span class="visually-hidden">Próximo</span>
        </button>
      </div>
    </section>

    <!-- SEÇÃO 2: cards com todas as notícias (montado pelo JS) -->
    <section id="noticias" class="container secao">
      <h2 class="titulo-secao">Todas as Notícias</h2>
      <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-4" id="lista-cards"></div>
    </section>

    <!-- SEÇÃO 3: informações do aluno (montado pelo JS) -->
    <section id="aluno" class="container secao">
      <h2 class="titulo-secao">Sobre o Autor do Site</h2>
      <div id="info-aluno" class="caixa-aluno"></div>
    </section>
  </main>

  <footer class="rodape">
    <p class="mb-0">© 2026 - Meu Site de Notícias</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>

<link rel="stylesheet" href="assents/style.css">
<script src="assents/app.js"></script>
